<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>轻账 · 自动记账新增功能提案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#181c1b;color:#182923;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}main{max-width:1020px;margin:40px auto;display:grid;grid-template-columns:260px 420px;gap:64px;padding:24px}aside{color:#b7c9c2;padding-top:50px}aside h1{font-size:26px;color:#f4faf7}aside p{line-height:1.8}aside nav{display:grid;gap:8px;margin-top:28px}aside button{background:transparent;text-align:left;padding:13px 16px;border-radius:14px;color:#b7c9c2}aside button[aria-pressed=true]{background:#2b4239;color:#a4e7d0}.phone{--bg:#f5f5f8;--card:#fff;--muted:#868a93;--mint:#76d5bb;--ink:#285e50;position:relative;background:var(--bg);border-radius:40px;width:420px;height:880px;overflow:hidden;box-shadow:0 28px 80px #0005;display:flex;flex-direction:column}.status{padding:22px 26px 16px;font-size:12px;display:flex;justify-content:space-between}.header{height:64px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}.header strong{font-size:21px}.back{position:absolute;left:18px;background:transparent;font-size:26px}.body{padding:18px 18px 38px;overflow:auto;flex:1}.card{background:var(--card);border-radius:23px;margin-bottom:16px;padding:20px}.flush{padding:0 18px}.row{width:100%;display:flex;align-items:center;gap:12px;min-height:76px;text-align:left;background:transparent;padding:14px 0}.row+.row{border-top:1px solid #eceef0}.tile{width:40px;height:40px;border-radius:14px;background:#e7f5ef;display:grid;place-items:center;color:var(--ink);font-size:20px;flex-shrink:0}.grow{flex:1}.title{display:block;font-size:15px;font-weight:600}.sub{display:block;font-size:12px;color:var(--muted);line-height:1.6;margin-top:4px}.right{color:var(--muted);font-size:18px}.pill{font-size:11px;border-radius:9px;background:#e7f5ef;color:var(--ink);padding:5px 8px;white-space:nowrap}.toggle{width:48px;height:28px;border-radius:18px;background:#ddd;position:relative;flex-shrink:0}.toggle:after{content:"";width:22px;height:22px;border-radius:50%;background:white;position:absolute;top:3px;left:3px}.toggle.on{background:#90d5bf}.toggle.on:after{left:23px;background:#2c6654}.split{display:flex;justify-content:space-between;gap:14px}.metrics{border-top:1px solid #eceef0;padding-top:16px;margin-top:17px}.metrics strong{font-size:23px;display:block;margin-top:8px}.section{color:var(--muted);font-size:12px;margin:24px 4px 12px}.note{color:var(--muted);font-size:12px;line-height:1.8;margin:14px 4px}.action{min-height:48px;border-radius:16px;background:var(--mint);color:var(--ink);font-weight:600;padding:12px 18px}.secondary{background:#eceef0;color:#565d5a}.buttons{display:flex;gap:12px;margin-top:20px}.buttons>*{flex:1}.homebar{height:4px;width:116px;background:#85898d;border-radius:4px;position:absolute;bottom:11px;left:calc(50% - 58px)}.notification{background:#fff;border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 6px 24px #1b3b2910}.notification .name{font-size:11px;color:#767d79;display:flex;gap:8px;align-items:center;margin-bottom:12px}.money{font-size:19px;font-weight:650;margin-top:12px}.expense{color:#cf6671}.income{color:#448e78}.sheet-mask{position:absolute;inset:0;background:#0005;display:flex;align-items:flex-end;z-index:5}.sheet{width:100%;max-height:790px;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:14px 20px 36px;box-shadow:0 -5px 32px #0001}.handle{height:4px;width:42px;background:#c9c9cd;border-radius:4px;margin:0 auto 16px}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheethead strong{font-size:20px}.close{background:transparent;font-size:22px;color:#777}.segments{display:flex;background:#eceef0;border-radius:14px;padding:4px;gap:4px}.segments button{flex:1;padding:9px 4px;border-radius:11px;background:transparent;font-size:13px;color:#858991}.segments button[aria-pressed=true]{background:#fff;color:#14211c;box-shadow:0 1px 5px #00000005}.amount{display:flex;align-items:center;justify-content:center;gap:14px;padding:24px 0 20px}.amount span{font-size:24px}.amount input{background:transparent;border:0;width:150px;text-align:center;font-size:39px;font-weight:650;color:#16261f}.fields{padding:0 16px;background:white;border-radius:22px}.field{display:flex;align-items:center;gap:16px;padding:15px 0;min-height:54px}.field+.field{border-top:1px solid #eceef0}.field label{color:#747d78;font-size:13px;white-space:nowrap}.field input,.field select{width:100%;min-width:0;flex:1;border:0;background:transparent;color:#273a30;text-align:right;outline-color:#76d5bb;font-size:13px}.datepair{display:flex;gap:8px;flex:1;min-width:0}.datepair input{font-size:11px}.status-block{text-align:center;padding:12px}.status-block .tile{margin:0 auto 15px;width:54px;height:54px;font-size:25px}.status-block h2{font-size:21px;margin:8px 0}.status-block p{color:#858c88;font-size:12px}.steps{counter-reset:s}.step{display:flex;align-items:center;gap:12px;padding:13px 0}.step:before{counter-increment:s;content:counter(s);background:#e7f5ef;color:#285e50;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.step strong{display:block;font-size:14px}.empty-illustration{height:120px;border-radius:20px;background:linear-gradient(145deg,#f0f8f4,#e5f2ec);margin-top:18px;display:grid;place-items:center;font-size:40px;color:#80b6a3}.toast{position:absolute;bottom:42px;left:20px;right:20px;background:#253b32ed;color:white;border-radius:16px;padding:12px 16px;text-align:center;z-index:9;font-size:12px}.footer-note{color:#8aa196;font-size:12px;line-height:1.8;margin-top:32px}button:focus-visible{outline:2px solid #6dd9b5;outline-offset:3px}@media(max-width:800px){main{margin:0;display:block;padding:20px}aside{padding-top:0;max-width:420px;margin:auto}aside nav{display:flex;overflow:auto;gap:4px;margin:14px 0 20px}aside nav button{white-space:nowrap;padding:10px}aside p,.footer-note{display:none}.phone{max-width:100%;margin:auto;width:420px;height:min(880px,calc(100dvh - 150px))}}
.field .segments{flex:1;min-width:0}.field .segments button{padding:8px 2px;font-size:12px;white-space:nowrap}
.sheet.confirmation .sheethead{margin-bottom:4px}.sheet.confirmation .amount{padding:12px 0 18px}
</style>
<main>
<aside><h1>自动记账 · 新增选项</h1><p>设计提案，尚未接入 Android。<br>原有直接入账保留。<br>金额和权限状态均为演示。</p><nav aria-label="预览场景"><button data-page="auto" aria-pressed="true">01 自动记账设置</button><button data-page="notification">02 今日收支通知</button><button data-page="confirm">03 确认记账弹窗</button><button data-page="shizuku">04 Shizuku 配置</button></nav><div class="footer-note">薄荷绿 · miuix 风格<br>新增交互获确认后，同步主设计稿与 Android 实现。</div></aside>
<section class="phone" aria-label="轻账新增功能设计预览"><div class="status"><span>09:41</span><span>▮▮ · Wi-Fi · 100%</span></div><header class="header"><button class="back" data-page="auto" aria-label="返回自动记账">‹</button><strong id="heading">自动记账</strong></header><div class="body" id="body"></div><div class="homebar"></div><div id="layers"></div><div class="toast" id="toast" hidden role="status"></div></section>
</main>
<script>
(()=>{
const body=document.getElementById('body'),layers=document.getElementById('layers'),heading=document.getElementById('heading');
const state={page:'auto',booking:'直接入账',summary:true,shizuku:false,confirmed:false,candidateState:'PENDING',kind:'支出',draft:{amount:'28.00',category:'餐饮',account:'微信零钱',merchant:'社区食堂',note:'',original:'30.00',discount:'2.00'}};
let sheetTitle='';
const escaped=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const row=(title,sub,icon,action,right='›')=>`<button class="row" data-action="${action}"><span class="tile">${icon}</span><span class="grow"><span class="title">${title}</span>${sub?`<span class="sub">${sub}</span>`:''}</span><span class="right">${right}</span></button>`;
const action=(text,key,secondary=false)=>`<button class="action ${secondary?'secondary':''}" data-action="${key}">${text}</button>`;
const toggle=enabled=>`<span class="toggle ${enabled?'on':''}" aria-hidden="true"></span>`;
function automatic(){return `<section class="card"><div class="split"><strong style="font-size:19px">自动记账已开启</strong>${toggle(true)}</div><div class="sub" style="margin-top:12px">${state.shizuku?'Shizuku + ADB':'无障碍'}　<span class="pill">运行正常</span></div><div class="split metrics"><div><span class="sub">今日自动记账</span><strong>3 笔</strong></div><div><span class="sub">最近识别</span><strong style="font-size:15px">10-27 12:18</strong><span class="sub">社区食堂 · 已入账</span></div></div></section><section class="card flush">${row('采集方式',state.shizuku?'Shizuku + ADB':'无障碍','⌗','method')}${row('入账方式',state.booking,'✓','booking')}${row('权限与运行','后台、电池与通知设置','◇','permissions')}${row('采集来源','微信、支付宝','▤','sources')}</section><section class="card flush">${row('今日收支通知',state.summary?'展示当日收入与支出':'已关闭','♧','notification',toggle(state.summary))}</section><div class="section">记录</div><section class="card flush">${row('采集记录',state.booking==='确认后入账'?'待确认 1 笔':'查看入账、跳过和关联记录','▣','records')}</section>`;}
function notification(){return `<p class="note">通知样式示意，实际外观由手机系统决定。</p><section class="notification"><div class="name"><span class="tile" style="width:24px;height:24px;border-radius:8px;font-size:14px">轻</span><span>轻账 · 现在</span></div><strong>今日收支</strong><div class="split money"><span class="expense">支出 ¥52.00</span><span class="income">收入 ¥200.00</span></div><div class="sub" style="margin-top:12px">日常账本 · 待确认 1 笔</div></section><section class="card flush">${row('今日收支通知','与账本中的今日汇总同步','♧','togglesummary',toggle(state.summary))}${row('锁屏金额','隐藏具体金额','◇','lockprivacy','隐藏')}</section><div class="section">待确认通知</div><section class="notification"><div class="name">轻账 · 微信 · 现在</div><strong>有一笔交易待确认</strong><div class="sub">社区食堂 · ¥28.00</div><div class="buttons">${action('查看并确认','openconfirm')}</div></section><p class="note">未确认不计入今日收支；识别进度和结果继续使用原 Live Updates 通知。</p>`;}
function shizuku(){return `<section class="card status-block"><span class="tile">⌘</span><h2>Shizuku + ADB</h2><p>${state.shizuku?'已连接 · ADB 身份':'等待启动和授权'}</p><span class="pill">${state.shizuku?'可开启采集':'未连接'}</span></section><section class="card"><div class="step"><div><strong>安装并启动 Shizuku</strong><span class="sub">使用无线调试或电脑 ADB 启动</span></div></div><div class="step"><div><strong>授权轻账</strong><span class="sub">由你在 Shizuku 授权窗口中允许</span></div></div><div class="step"><div><strong>开启自动记账</strong><span class="sub">只识别你开启的支付来源</span></div></div><div class="buttons">${action(state.shizuku?'重新检查':'连接并授权','connectshizuku')}</div></section><section class="card flush">${row('入账方式',state.booking,'✓','booking')}${row('采集来源','微信、支付宝','▤','sources')}</section><p class="note">此方式无需开启无障碍。支付宝的交易通知需另行授权通知访问。</p><p class="note">这是设计演示，不连接真实 Shizuku。</p>`;}
function render(){layers.innerHTML='';heading.textContent={auto:'自动记账',notification:'今日收支通知',confirm:'自动记账',shizuku:'Shizuku + ADB'}[state.page];body.innerHTML=state.page==='notification'?notification():state.page==='shizuku'?shizuku():automatic();document.querySelectorAll('aside [data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===state.page)));if(state.page==='confirm')confirmSheet();}
function sheet(title,content){sheetTitle=title;layers.innerHTML=`<div class="sheet-mask"><section class="sheet${title==='确认记账'?' confirmation':''}" role="dialog" aria-modal="true" aria-label="${title}"><div class="handle"></div><div class="sheethead"><strong>${title}</strong><button class="close" data-action="close" aria-label="${title==='确认记账'?'舍弃本次识别':'关闭'}">×</button></div>${content}</section></div>`;}
function dismiss(){if(sheetTitle==='确认记账'){state.candidateState='IGNORED';toast('演示：本次识别已舍弃，同一成功页不再弹出');}layers.innerHTML='';sheetTitle='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layers.innerHTML)dismiss();});
function confirmSheet(){
 const d=state.draft,options=(values,current)=>values.map(v=>`<option ${v===current?'selected':''}>${v}</option>`).join('');
 sheet('确认记账',`
 <div class="amount"><span>¥</span><input id="amount" data-field="amount" aria-label="金额" inputmode="decimal" value="${escaped(d.amount)}"></div>
 <div class="fields">
 <div class="field"><label id="booking-kind-label">入账类型</label><div class="segments" role="group" aria-labelledby="booking-kind-label">${['支出','收入','退款'].map(k=>`<button data-action="kind:${k}" aria-pressed="${state.kind===k}">${k}</button>`).join('')}</div></div>
 <div class="field"><label for="category">分类</label><select id="category" data-field="category">${options(['餐饮','交通','购物','未分类'],d.category)}</select></div>
 <div class="field"><label for="account">资金账户</label><select id="account" data-field="account">${options(['微信零钱','银行卡（1234）','未指定账户'],d.account)}</select></div>
 <div class="field"><label for="merchant">商户 / 对方</label><input id="merchant" data-field="merchant" value="${escaped(d.merchant)}"></div>
 ${state.kind==='支出'?`<div class="field"><label for="original">原价（元）</label><input id="original" data-field="original" inputmode="decimal" value="${escaped(d.original)}"></div><div class="field"><label for="discount">优惠（元）</label><input id="discount" data-field="discount" inputmode="decimal" value="${escaped(d.discount)}"></div>`:''}
 <div class="field"><label for="note">备注</label><input id="note" data-field="note" placeholder="可填写" value="${escaped(d.note)}"></div>
 </div><div class="buttons">${action('取消','ignore',true)}${action('确认入账','confirmbooking')}</div>`);
}
document.addEventListener('input',e=>{if(e.target.dataset.field)state.draft[e.target.dataset.field]=e.target.value;});
document.addEventListener('change',e=>{if(e.target.dataset.field)state.draft[e.target.dataset.field]=e.target.value;});
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3000);}
document.addEventListener('click',event=>{if(event.target.classList?.contains('sheet-mask')){dismiss();return;}const target=event.target.closest('button');if(!target)return;if(target.dataset.page){if(sheetTitle==='确认记账')dismiss();state.page=target.dataset.page;if(state.page==='confirm'){state.candidateState='PENDING';state.confirmed=false;}render();return;}const [key,value]=String(target.dataset.action||'').split(':');
if(key==='close')dismiss();
if(key==='booking')sheet('入账方式',row('直接入账','识别成功后自动入账','✓','choosebooking:直接入账',state.booking==='直接入账'?'✓':'')+row('确认后入账','先编辑确认，再保存到账本','▤','choosebooking:确认后入账',state.booking==='确认后入账'?'✓':''));
if(key==='choosebooking'){state.booking=value;render();toast('演示：入账方式已选择，不处理已有待确认项');}
if(key==='method')sheet('采集方式',row('无障碍','读取所选来源的页面与交易通知','⌗','chooseaccessibility',state.shizuku?'':'✓')+row('Shizuku + ADB','配置连接与授权','⌘','shizuku',state.shizuku?'✓':'›')+row('Root','尚未接入','◇','root','开发中'));
if(key==='chooseaccessibility'){state.shizuku=false;render();}
if(key==='root')toast('Root 后端尚未接入');
if(key==='notification'||key==='shizuku'){state.page=key;render();}
if(key==='togglesummary'){state.summary=!state.summary;render();}
if(key==='lockprivacy')toast('设计方案：锁屏隐藏具体金额');
if(key==='connectshizuku'){state.shizuku=true;render();toast('演示已连接，不授予真实系统权限');}
if(key==='openconfirm'){if(state.candidateState!=='PENDING'){toast('本条示例已处理；重新选择左侧弹窗场景可演示下一笔');return;}state.page='confirm';render();}
if(key==='kind'){state.kind=value;confirmSheet();}
if(key==='confirmbooking'){const value=state.draft.amount.trim();if(!/^\d+(\.\d{1,2})?$/.test(value)||Number(value)<=0){toast('请输入有效金额');return;}if(state.kind==='支出'){const o=state.draft.original.trim(),d=state.draft.discount.trim(),valid=v=>/^\d+(\.\d{1,2})?$/.test(v),cents=v=>Math.round(Number(v)*100);if(o&&!valid(o)||d&&!valid(d)||o&&cents(o)<cents(value)||o&&d&&cents(o)-cents(d)!==cents(value)){toast('请核对原价、优惠与实付金额');return;}}state.bookedAt=Date.now();state.confirmed=true;state.candidateState='CONFIRMED';sheetTitle='';layers.innerHTML='';toast('演示：已确认入账，不写入真实账本');}
if(key==='ignore')dismiss();
if(key==='records')sheet('采集记录',row('社区食堂 · ¥28.00','微信 · 待确认','▤','openconfirm','›'));
if(key==='permissions')sheet('权限与运行',row('确认弹窗','显示在其他应用上层','◇','mockpermission','去授权')+row('通知访问','支付宝通知采集','♧','mockpermission','去授权')+row('后台运行','按系统设置配置','⌗','mockpermission','去配置'));
if(key==='mockpermission')toast('设计演示，实际授权将由你在系统设置中操作');
if(key==='sources')sheet('采集来源',row('微信','成功页识别与付款前账户关联','▤','noop','已开启')+row('支付宝','交易与退款通知识别','▤','noop','已开启'));
});render();
})();
</script>
</html>
